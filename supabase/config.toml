# Supabase CLI configuration file for Arth
# Database migrations, seed scripts, and local emulation settings

project_id = "arth"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.pooler]
enabled = false
port = 54329

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000/auth/callback",
  "http://localhost:3000/auth/confirm",
  "http://localhost:3000/**",
  "https://arth-9h3f.vercel.app/auth/callback",
  "https://arth-9h3f.vercel.app/auth/confirm",
  "https://arth-9h3f.vercel.app/**"
]
jwt_expiry = 3600
enable_signup = true

[auth.email.template.confirmation]
subject = "Confirm your Arth email address"
content_path = "./templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your Arth password"
content_path = "./templates/recovery.html"

[auth.email.template.magic_link]
subject = "Your Arth sign-in link"
content_path = "./templates/magic_link.html"

[auth.email.template.email_change]
subject = "Confirm your new email address for Arth"
content_path = "./templates/email_change.html"

[auth.email.template.invite]
subject = "You have been invited to Arth"
content_path = "./templates/invite.html"

[auth.email.template.reauthentication]
subject = "Your Arth verification code"
content_path = "./templates/reauthentication.html"

[storage]
enabled = false
