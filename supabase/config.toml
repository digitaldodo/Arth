# Supabase CLI configuration file for Arth
# Database migrations, seed scripts, and local emulation settings

project_id = "arth"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.pooler]
enabled = false
port = 54329

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000/auth/callback",
  "https://arth-9h3f.vercel.app/auth/callback",
  "https://arth-9h3f.vercel.app/**"
]
jwt_expiry = 3600
enable_signup = true

[storage]
enabled = false
