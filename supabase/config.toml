# Supabase CLI configuration file for Arth
# Database migrations, seed scripts, and local emulation settings

project_id = "arth"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.pooler]
enabled = false
port = 54329

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000/auth/callback",
  "http://localhost:3000/auth/confirm",
  "http://localhost:3000/**",
  "https://arth-9h3f.vercel.app/auth/callback",
  "https://arth-9h3f.vercel.app/auth/confirm",
  "https://arth-9h3f.vercel.app/**"
]
jwt_expiry = 3600
enable_signup = true

[auth.email.template.confirmation]
subject = "Confirm your SpendSense email address."
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your SpendSense password."
content_path = "./supabase/templates/recovery.html"

[auth.email.template.magic_link]
subject = "Your SpendSense sign-in link."
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.email_change]
subject = "Confirm your new SpendSense email address."
content_path = "./supabase/templates/email_change.html"

[auth.email.template.invite]
subject = "You're invited to SpendSense."
content_path = "./supabase/templates/invite.html"

[auth.email.template.reauthentication]
subject = "Your SpendSense verification code."
content_path = "./supabase/templates/reauthentication.html"

[storage]
enabled = false
