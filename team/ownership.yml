# SpendSense — Strict File, Directory & Database Ownership Registry
# Baseline: main @ 518d3c9 (Group 369)

version: 1
product: SpendSense
legacy_identifier: Arth
default_branch: main

integration_lead:
  name: Ansh Gupta
  roll_number: "2315000330"
  shared_resources_controlled:
    - path: backend/src/app.ts
      policy: PR-gated plugin registration only
    - path: packages/contracts/src/
      policy: Contract-first PR with affected consumer sign-off
    - path: packages/financial-modules/src/shared/
      policy: Contract-first PR with affected consumer sign-off
    - path: frontend/src/features/transactions/TransactionAppShell.tsx
      policy: PR-gated dynamic import slot replacement only
    - path: frontend/src/lib/api-client/
      policy: Shared client preserved; new modules add fetchers inside their own feature folder
    - path: package.json
      policy: Root workspace scripts & dependencies maintainer only
    - path: pnpm-workspace.yaml
      policy: Integration lead only
    - path: pnpm-lock.yaml
      policy: Integration lead / coordinated dependency PRs only

frozen_resources:
  - path: supabase/migrations/0001_create_profiles.sql .. 0039_consolidated_ledger_balances.sql
    reason: Applied/historical append-only migration chain
  - path: backend/src/plugins/auth.ts
    reason: Shared JWT verification security boundary
  - path: frontend/src/proxy.ts
    reason: Shared Next.js 16 Supabase SSR session refresher
  - path: frontend/src/features/auth/
    reason: Shared authentication lifecycle
  - path: frontend/src/app/api/backend/[...segments]/route.ts
    reason: Frozen catch-all proxy; new modules must use dedicated /api/backend/<module>/ routes
  - path: backend/src/modules/documents/
    reason: Shared document metadata & storage intake boundary consumed by Module E
  - path: backend/src/modules/balances/
    reason: Shared consolidated Cash/Online balance engine
  - path: backend/src/modules/transactions/
    reason: Core ledger CRUD & outbox trigger boundary
  - path: backend/src/modules/categories/
    reason: Shared category taxonomy
  - path: backend/src/modules/people/
    reason: Existing People & Money Tracker extension
  - path: backend/src/modules/dashboard/
    reason: Existing dashboard summary RPC wrapper
  - path: android/
    reason: Native Android companion (frozen during web/backend synopsis sprint)

modules:
  A_transaction_intelligence:
    owner: Ansh Gupta
    roll_number: "2315000330"
    migration_slot: "0040 (only if needed for merchant_rules / ML provenance)"
    owned_paths:
