name: Arth Android Release & Distribution Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/android-release.yml'
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Semantic version name (e.g. 1.2.0)'
        required: false
        default: '1.2.0'
      version_code:
        description: 'Integer version code override (leave blank for automatic)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-verify-release:
    name: Build, Verify & Publish Direct Android Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Restore Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Resolve Release Version
        id: resolve-version
        run: |
          BASE_VERSION="1.2.0"
          if [ -n "${{ github.event.inputs.version_name }}" ]; then
            BASE_VERSION="${{ github.event.inputs.version_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            BASE_VERSION="${GITHUB_REF_NAME#v}"
          fi

          BUILD_NUM="${{ github.run_number }}"
          if [ -n "${{ github.event.inputs.version_code }}" ]; then
            V_CODE="${{ github.event.inputs.version_code }}"
          else
            V_CODE=$((1000 + BUILD_NUM))
          fi

          FULL_VERSION="${BASE_VERSION}+build.${BUILD_NUM}"
          TAG_VERSION="v${BASE_VERSION}-b${BUILD_NUM}"

          echo "BASE_VERSION=${BASE_VERSION}" >> $GITHUB_ENV
          echo "BUILD_NUM=${BUILD_NUM}" >> $GITHUB_ENV
          echo "VERSION_CODE=${V_CODE}" >> $GITHUB_ENV
          echo "FULL_VERSION=${FULL_VERSION}" >> $GITHUB_ENV
          echo "TAG_VERSION=${TAG_VERSION}" >> $GITHUB_ENV
          echo "Resolved Version: ${FULL_VERSION} (code: ${V_CODE})"

      - name: Decode Release Keystore
        id: prepare-keystore
        env:
          KEYSTORE_PRIMARY: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_FALLBACK: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          KEYSTORE_BASE64="${KEYSTORE_PRIMARY:-$KEYSTORE_FALLBACK}"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding production signing keystore from GitHub Secrets..."
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            echo "has_keystore=true" >> $GITHUB_OUTPUT
          else
            echo "::warning::Production keystore secret not set. Generating ephemeral signing key for artifact signing."
            keytool -genkey -v -keystore android/app/release.keystore -alias arth -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "arthReleaseKeyPass123" -keypass "arthReleaseKeyPass123" \
              -dname "CN=Arth Release, OU=Mobile, O=Digital Dodo, L=Bangalore, ST=Karnataka, C=IN"
            echo "EPHEMERAL_KEY_PASS=arthReleaseKeyPass123" >> $GITHUB_ENV
            echo "has_keystore=false" >> $GITHUB_OUTPUT
          fi

      - name: Run Android Unit Tests
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew testLocalDebugUnitTest --no-daemon --stacktrace

      - name: Build Direct Distribution APK (localRelease)
        working-directory: android
        env:
          KEYSTORE_FILE: "release.keystore"
          ANDROID_KEYSTORE_PATH: "release.keystore"
          INPUT_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          INPUT_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          INPUT_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          BUILD_NUMBER: ${{ env.BUILD_NUM }}
          VERSION_NAME: ${{ env.BASE_VERSION }}
          VERSION_CODE: ${{ env.VERSION_CODE }}
        run: |
          export KEYSTORE_PASSWORD="${INPUT_KEYSTORE_PASSWORD:-$EPHEMERAL_KEY_PASS}"
          export ANDROID_KEYSTORE_PASSWORD="${INPUT_KEYSTORE_PASSWORD:-$EPHEMERAL_KEY_PASS}"
          export KEY_ALIAS="${INPUT_KEY_ALIAS:-arth}"
          export ANDROID_KEY_ALIAS="${INPUT_KEY_ALIAS:-arth}"
          export KEY_PASSWORD="${INPUT_KEY_PASSWORD:-$EPHEMERAL_KEY_PASS}"
          export ANDROID_KEY_PASSWORD="${INPUT_KEY_PASSWORD:-$EPHEMERAL_KEY_PASS}"
          ./gradlew :app:assembleLocalRelease --no-daemon --stacktrace

      - name: Package & Prepare Artifacts
        id: package-artifacts
        run: |
          RAW_APK=$(find android/app/build/outputs/apk/local/release -name "*.apk" ! -name "*unsigned*" | head -n 1)
          if [ -z "$RAW_APK" ]; then
            RAW_APK=$(find android/app/build/outputs/apk/local/release -name "*.apk" | head -n 1)
          fi

          if [ -z "$RAW_APK" ] || [ ! -f "$RAW_APK" ]; then
            echo "::error::Expected APK was not generated in android/app/build/outputs/apk/local/release"
            exit 1
          fi

          echo "Found generated APK: $RAW_APK"
          cp "$RAW_APK" Arth.apk

          # Verify signature
          echo "Verifying APK signature with apksigner..."
          BUILD_TOOLS_DIR=$(find $ANDROID_HOME/build-tools -maxdepth 1 -mindepth 1 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$BUILD_TOOLS_DIR" ]; then
            BUILD_TOOLS_DIR=$(find /usr/local/lib/android/sdk/build-tools -maxdepth 1 -mindepth 1 2>/dev/null | sort -V | tail -n 1)
          fi
          echo "Using build-tools at: $BUILD_TOOLS_DIR"
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose Arth.apk || true

          # Enforce security boundary: ZERO SMS permissions in direct download APK
          echo "Verifying zero SMS permissions in APK manifest..."
          DUMP_PERMS=$("$BUILD_TOOLS_DIR/aapt" dump permissions Arth.apk || true)
          if echo "$DUMP_PERMS" | grep -E -i "READ_SMS|RECEIVE_SMS|SEND_SMS"; then
            echo "::error::SECURITY VIOLATION: Direct distribution APK contains restricted SMS permissions!"
            exit 1
          fi
          echo "Verified: Direct release APK contains zero SMS permissions."

          # Calculate SHA-256 Checksum
          sha256sum Arth.apk > Arth.apk.sha256
          SHA256_HASH=$(cut -d ' ' -f 1 Arth.apk.sha256)
          echo "SHA256_HASH=${SHA256_HASH}" >> $GITHUB_ENV
          echo "APK Checksum: ${SHA256_HASH}"

          # Compute file size
          APK_BYTES=$(wc -c < Arth.apk)
          APK_SIZE_MB=$(awk "BEGIN {printf \"%.1f MB\", $APK_BYTES / (1024 * 1024)}")
          echo "APK_SIZE_MB=${APK_SIZE_MB}" >> $GITHUB_ENV

          # Generate dynamic release metadata JSON
          cat <<EOF > release.json
{
  "version": "${{ env.BASE_VERSION }}",
  "versionCode": ${{ env.VERSION_CODE }},
  "buildNumber": ${{ env.BUILD_NUM }},
  "releaseDate": "$(date -u +%Y-%m-%d)",
  "minAndroidVersion": "Android 8.0 (API 26)",
  "targetAndroidVersion": "Android 15 (API 35)",
  "apkFileName": "Arth.apk",
  "apkSize": "${APK_SIZE_MB}",
  "downloadUrl": "https://github.com/${{ github.repository }}/releases/download/android-latest/Arth.apk",
  "githubReleaseUrl": "https://github.com/${{ github.repository }}/releases/tag/android-latest",
  "sha256": "${SHA256_HASH}",
  "highlights": [
    "Native Kotlin and Jetpack Compose interface adhering to the Arth Ledger Minimal design system",
    "Offline-first transaction management with local Room database and Supabase synchronization",
    "Biometric Fingerprint & Device Credential app lock with AndroidX BiometricPrompt",
    "Direct distribution build with zero sensitive SMS permissions for user privacy and security"
  ],
  "disclaimer": "This direct APK release does not request or include SMS permissions. Financial transaction auto-detection from SMS is exclusive to the upcoming Google Play Store release."
}
EOF

      - name: Publish Perpetual Latest Release (tag android-latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: "Arth Android Latest Release (${{ env.FULL_VERSION }})"
          body: |
            ### Arth for Android — Latest Direct Release (${{ env.FULL_VERSION }})

            Official native Android application for **Arth**, built with Kotlin & Jetpack Compose.

            #### Download & Verification
            - **Direct Download**: [`Arth.apk`](https://github.com/${{ github.repository }}/releases/download/android-latest/Arth.apk)
            - **Package Size**: `${{ env.APK_SIZE_MB }}`
            - **Minimum Android**: Android 8.0 (Oreo, API 26)+
            - **Target Android**: Android 15 (API 35)
            - **SHA-256 Checksum**:
              ```
              ${{ env.SHA256_HASH }}
              ```

            #### Security & Privacy Guarantee
            This direct distribution package deliberately contains **zero SMS permissions** (`READ_SMS` / `RECEIVE_SMS`), ensuring seamless installation without Google Play Protect security warnings.

            #### Quick Install
            1. Download `Arth.apk` onto your Android phone.
            2. Tap the downloaded file in your browser downloads or Notifications.
            3. If prompted, allow installation from this source.
            4. Tap **Install** and sign in to Arth.
          files: |
            Arth.apk
            Arth.apk.sha256
            release.json
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Versioned GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_VERSION }}
          name: "Arth Android ${{ env.FULL_VERSION }}"
          body: |
            ### Arth for Android — Release ${{ env.FULL_VERSION }}

            Official native release build `${{ env.FULL_VERSION }}`.
            SHA-256: `${{ env.SHA256_HASH }}`
          files: |
            Arth.apk
            Arth.apk.sha256
            release.json
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
