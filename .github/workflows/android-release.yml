name: Arth Android Release

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:
    inputs:
      version_name:
        description: Semantic version (for example 1.3.1)
        required: false
        default: ''
      version_code:
        description: Monotonically increasing Android versionCode override
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: arth-android-release
  cancel-in-progress: false

jobs:
  build-verify-release:
    name: Build, verify, and publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Restore Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Require persistent signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for value in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!value}" ]; then
              echo "::error::Missing required GitHub Actions secret: ANDROID_${value}"
              exit 1
            fi
          done
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/arth-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/arth-release.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/arth-release.jks" >> "$GITHUB_ENV"

      - name: Resolve release version
        id: version
        env:
          INPUT_VERSION_NAME: ${{ inputs.version_name }}
          INPUT_VERSION_CODE: ${{ inputs.version_code }}
        run: |
          VERSION_NAME="${INPUT_VERSION_NAME:-1.3.0}"
          VERSION_CODE="${INPUT_VERSION_CODE:-$((1006 + GITHUB_RUN_NUMBER))}"
          if ! [[ "$VERSION_CODE" =~ ^[0-9]+$ ]] || [ "$VERSION_CODE" -le 1005 ]; then
            echo "::error::versionCode must be an integer greater than the previously published code 1005."
            exit 1
          fi
          FULL_VERSION="${VERSION_NAME}+build.${GITHUB_RUN_NUMBER}"
          TAG_VERSION="v${VERSION_NAME}-b${GITHUB_RUN_NUMBER}"
          {
            echo "VERSION_NAME=$VERSION_NAME"
            echo "VERSION_CODE=$VERSION_CODE"
            echo "FULL_VERSION=$FULL_VERSION"
            echo "TAG_VERSION=$TAG_VERSION"
          } >> "$GITHUB_ENV"

      - name: Run Android release checks
        working-directory: android
        run: bash ./gradlew testLocalDebugUnitTest --no-daemon --stacktrace

      - name: Build signed direct distribution APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_NAME: ${{ env.VERSION_NAME }}
          VERSION_CODE: ${{ env.VERSION_CODE }}
        run: bash ./gradlew :app:assembleLocalRelease --no-daemon --stacktrace

      - name: Verify package, signature, permissions, and metadata
        id: artifact
        env:
          ANDROID_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          BUILD_TOOLS_DIR="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          APK="android/app/build/outputs/apk/local/release/app-local-release.apk"
          test -f "$APK"
          cp "$APK" "$RUNNER_TEMP/Arth.apk"
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose "$RUNNER_TEMP/Arth.apk"
          "$BUILD_TOOLS_DIR/aapt" dump badging "$RUNNER_TEMP/Arth.apk" | grep -F "package: name='com.digitaldodo.arth' versionCode='$VERSION_CODE' versionName='$FULL_VERSION'"
          PERMISSIONS="$("$BUILD_TOOLS_DIR/aapt" dump permissions "$RUNNER_TEMP/Arth.apk")"
          if grep -E -i 'android\.permission\.(READ_SMS|RECEIVE_SMS|SEND_SMS)' <<< "$PERMISSIONS"; then
            echo '::error::The public direct distribution APK declares an SMS permission.'
            exit 1
          fi
          CERTIFICATE_SHA256="$("$BUILD_TOOLS_DIR/apksigner" verify --print-certs "$RUNNER_TEMP/Arth.apk" | sed -n 's/.*certificate SHA-256 digest: //p' | head -n 1)"
          test -n "$CERTIFICATE_SHA256"
          APK_SHA256="$(sha256sum "$RUNNER_TEMP/Arth.apk" | cut -d ' ' -f 1)"
          APK_BYTES="$(wc -c < "$RUNNER_TEMP/Arth.apk" | tr -d ' ')"
          APK_SIZE="$(awk "BEGIN {printf \"%.1f MB\", $APK_BYTES / (1024 * 1024)}")"
          RELEASE_DATE="$(date -u +%F)"
          export CERTIFICATE_SHA256 APK_SHA256 APK_SIZE RELEASE_DATE VERSION_CODE FULL_VERSION
          node - <<'NODE'
          const fs = require('fs');
          const meta = {
            published: true,
            applicationId: 'com.digitaldodo.arth',
            version: process.env.FULL_VERSION,
            versionCode: Number(process.env.VERSION_CODE),
            buildNumber: Number(process.env.GITHUB_RUN_NUMBER),
            releaseDate: process.env.RELEASE_DATE,
            minAndroidVersion: 'Android 8.0 (API 26)',
            targetAndroidVersion: 'Android 15 (API 35)',
            apkFileName: 'Arth.apk',
            apkSize: process.env.APK_SIZE,
            downloadUrl: '/api/android/download',
            githubReleaseUrl: `https://github.com/${process.env.ANDROID_REPOSITORY}/releases/tag/android-latest`,
            sha256: process.env.APK_SHA256,
            signingCertificateSha256: process.env.CERTIFICATE_SHA256,
            highlights: [
              'This production release uses a new permanent Android application ID. It installs beside the earlier direct package; keep the earlier Arth app until its local records have synced and been checked.',
              'Native Arth Android app with offline transaction capture and authenticated cloud sync.',
              'Direct download build requests no SMS permissions. Bank-message access is unavailable in this distribution.',
              'Signed updates preserve app data when installed over Arth using the same application ID and signing key.',
            ],
            disclaimer: 'This is the native Android application. The Arth website and installable PWA remain available separately. The APK does not request READ_SMS or RECEIVE_SMS. Android requires a user-confirmed install or update; do not uninstall the app to update it. Keep any earlier Arth installation until you have verified its records in your account.',
          };
          fs.writeFileSync('release.json', JSON.stringify(meta, null, 2) + '\n');
          NODE
          printf '%s  Arth.apk\n' "$APK_SHA256" > Arth.apk.sha256
          echo "APK_SIZE=$APK_SIZE" >> "$GITHUB_ENV"
          echo "APK_SHA256=$APK_SHA256" >> "$GITHUB_ENV"
          echo "CERTIFICATE_SHA256=$CERTIFICATE_SHA256" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/arth-release"
          cp "$RUNNER_TEMP/Arth.apk" "$RUNNER_TEMP/arth-release/Arth.apk"
          cp Arth.apk.sha256 release.json "$RUNNER_TEMP/arth-release/"
          echo "apk_sha256=$APK_SHA256" >> "$GITHUB_OUTPUT"

      - name: Publish stable download channel
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Arth for Android ${{ env.FULL_VERSION }}
          body: |
            Official native Arth Android release ${{ env.FULL_VERSION }}.

            **Version:** ${{ env.FULL_VERSION }} (code ${{ env.VERSION_CODE }})
            **Minimum Android:** 8.0 (API 26)
            **APK size:** ${{ env.APK_SIZE }}
            **SHA-256:** `${{ env.APK_SHA256 }}`

            This direct download build does not request SMS permissions. Install and updates require Android's confirmation. Keep the existing app installed when updating to preserve its local data.
          files: |
            ${{ runner.temp }}/arth-release/Arth.apk
            ${{ runner.temp }}/arth-release/Arth.apk.sha256
            ${{ runner.temp }}/arth-release/release.json
          draft: false
          prerelease: false
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish immutable version archive
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_VERSION }}
          name: Arth for Android ${{ env.FULL_VERSION }}
          body: |
            Official native Arth Android release ${{ env.FULL_VERSION }}.

            Version code: ${{ env.VERSION_CODE }}
            Minimum Android: 8.0 (API 26)
            SHA-256: `${{ env.APK_SHA256 }}`
          files: |
            ${{ runner.temp }}/arth-release/Arth.apk
            ${{ runner.temp }}/arth-release/Arth.apk.sha256
            ${{ runner.temp }}/arth-release/release.json
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
