name: Release Android APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Semantic version name (e.g. 1.0.0)'
        required: true
        default: '1.0.0'
      version_code:
        description: 'Sequential version code (integer, e.g. 1)'
        required: true
        default: '1'
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Signed Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Prepare Release Signing Keystore
        id: prepare-keystore
        run: |
          if [ -n "${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "Decoding release keystore from GitHub Secrets..."
            echo "${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
            echo "keystore_available=true" >> $GITHUB_OUTPUT
          else
            echo "::warning::ANDROID_RELEASE_KEYSTORE_BASE64 secret is not configured. Building unsigned/debug release."
            echo "keystore_available=false" >> $GITHUB_OUTPUT
          fi

      - name: Determine Version
        id: versioning
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION_NAME="${{ github.event.inputs.version_name }}"
            VERSION_CODE="${{ github.event.inputs.version_code }}"
            TAG_NAME="v${VERSION_NAME}"
          else
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            VERSION_NAME="${TAG_NAME#v}"
            VERSION_CODE="${{ github.run_number }}"
          fi
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_ENV
          echo "VERSION_CODE=${VERSION_CODE}" >> $GITHUB_ENV
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_ENV

      - name: Build Android APK with Gradle
        working-directory: android
        env:
          KEYSTORE_FILE: "release.keystore"
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'arth' }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_CERT_SHA256: ${{ secrets.ANDROID_CERT_SHA256 }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PversionName=${{ env.VERSION_NAME }} -PversionCode=${{ env.VERSION_CODE }} --stacktrace

      - name: Locate and Package Release APK
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::Release APK was not generated."
            exit 1
          fi
          echo "Found release APK at: $APK_PATH"
          cp "$APK_PATH" Arth.apk

      - name: Compute SHA-256 Checksum
        run: |
          sha256sum Arth.apk > Arth.apk.sha256
          echo "APK Checksum:"
          cat Arth.apk.sha256

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "Arth Android ${{ env.TAG_NAME }}"
          body: |
            ### Arth for Android — Release ${{ env.TAG_NAME }}

            Official Android application for Arth (Trusted Web Activity).

            #### Download & Verification
            - **Binary**: [`Arth.apk`](https://github.com/digitaldodo/Arth/releases/download/${{ env.TAG_NAME }}/Arth.apk)
            - **Latest Direct URL**: [`https://github.com/digitaldodo/Arth/releases/latest/download/Arth.apk`](https://github.com/digitaldodo/Arth/releases/latest/download/Arth.apk)
            - **SHA-256 Checksum**:
              ```
              $(cat Arth.apk.sha256)
              ```

            #### Installation Instructions
            1. Download `Arth.apk` onto your Android phone or tablet.
            2. When prompted by your browser or file manager, enable **Install unknown apps** for that application.
            3. Tap **Install** to complete setup.
            4. Launch Arth from your home screen or app drawer.
          files: |
            Arth.apk
            Arth.apk.sha256
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
