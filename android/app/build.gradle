plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.devtools.ksp'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

def gradleValue = { String name, String fallback = '' ->
    providers.gradleProperty(name).orElse(providers.environmentVariable(name)).getOrElse(fallback)
}
def javaString = { String value -> '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"' }

def rawVersionCode = gradleValue('VERSION_CODE', gradleValue('versionCode', ''))
def rawVersionName = gradleValue('VERSION_NAME', gradleValue('versionName', ''))
def buildNumber = (gradleValue('BUILD_NUMBER', gradleValue('GITHUB_RUN_NUMBER', '6'))).toInteger()
def baseVersionName = rawVersionName ?: '1.3.0'
def finalVersionCode = rawVersionCode ? rawVersionCode.toInteger() : (1000 + buildNumber)
def finalVersionName = rawVersionName ? (rawVersionName.contains('+build.') ? rawVersionName : "${rawVersionName}+build.${buildNumber}") : "${baseVersionName}+build.${buildNumber}"

def releaseStoreFilePath = System.getenv("ANDROID_KEYSTORE_PATH") ?: System.getenv("KEYSTORE_FILE") ?: "release.keystore"
def releaseStorePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD") ?: System.getenv("KEYSTORE_PASSWORD")
def releaseKeyAlias = System.getenv("ANDROID_KEY_ALIAS") ?: System.getenv("KEY_ALIAS") ?: "arth"
def releaseKeyPassword = System.getenv("ANDROID_KEY_PASSWORD") ?: System.getenv("KEY_PASSWORD")
def releaseSigningReady = releaseStorePassword && releaseKeyPassword && file(releaseStoreFilePath).exists()

gradle.taskGraph.whenReady { taskGraph ->
    if (taskGraph.allTasks.any { it.path in [':app:assembleLocalRelease', ':app:packageLocalRelease'] } && !releaseSigningReady) {
        throw new GradleException('A persistent release keystore and signing credentials are required. Set ANDROID_KEYSTORE_PATH, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD. Unsigned or ephemeral release builds are disabled.')
    }
}

android {
    namespace 'com.digitaldodo.arth'
    compileSdk 35

    defaultConfig {
        applicationId "com.digitaldodo.arth"
        minSdk 26
        targetSdk 35
        versionCode finalVersionCode
        versionName finalVersionName

        def defaultApiUrl = 'https://arth-backend-nchl.onrender.com'
        def defaultSupabaseUrl = 'https://fbmmkqdwkayrrsodueqd.supabase.co'
        def defaultWebUrl = 'https://arth-9h3f.vercel.app'
        def defaultGoogleClientId = '973069107406-nharoaodd1gp3bbu91vh31akt2jibfl5.apps.googleusercontent.com'
        buildConfigField "String", "SUPABASE_URL", javaString(gradleValue('ARTH_SUPABASE_URL', defaultSupabaseUrl))
        buildConfigField "String", "SUPABASE_ANON_KEY", javaString(gradleValue('ARTH_SUPABASE_ANON_KEY', ''))
        buildConfigField "String", "API_URL", javaString(gradleValue('ARTH_API_URL', defaultApiUrl))
        buildConfigField "String", "WEB_URL", javaString(gradleValue('ARTH_WEB_URL', defaultWebUrl))
        buildConfigField "String", "GOOGLE_WEB_CLIENT_ID", javaString(gradleValue('GOOGLE_WEB_CLIENT_ID', defaultGoogleClientId))

        resValue "string", "appName", "Arth"
    }

    flavorDimensions = ["distribution"]
    productFlavors {
        local {
            dimension "distribution"
            versionNameSuffix ""
            buildConfigField "boolean", "SMS_DETECTION_SUPPORTED", "false"
            resValue "string", "appName", "Arth"
        }
        play {
            dimension "distribution"
            buildConfigField "boolean", "SMS_DETECTION_SUPPORTED", "true"
            resValue "string", "appName", "Arth"
        }
    }

    signingConfigs {
        release {
            if (releaseStorePassword && releaseKeyPassword && file(releaseStoreFilePath).exists()) {
                storeFile file(releaseStoreFilePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            minifyEnabled true
            shrinkResources true
            if (releaseSigningReady) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
        freeCompilerArgs += [
            "-opt-in=androidx.compose.material3.ExperimentalMaterial3Api",
            "-opt-in=kotlinx.coroutines.ExperimentalCoroutinesApi"
        ]
    }

    buildFeatures {
        buildConfig true
        compose true
    }
}

dependencies {
    // Compose BOM & Core
    def composeBom = platform('androidx.compose:compose-bom:2024.10.01')
    implementation composeBom
    androidTestImplementation composeBom

    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.navigation:navigation-compose:2.8.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.6'

    // AndroidX & Architecture
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.datastore:datastore-preferences:1.1.1'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.work:work-runtime-ktx:2.9.1'
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'

    // Room Database with KSP
    def roomVersion = '2.6.1'
    implementation "androidx.room:room-runtime:$roomVersion"
    implementation "androidx.room:room-ktx:$roomVersion"
    ksp "androidx.room:room-compiler:$roomVersion"

    // Networking & Serialization
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-kotlinx-serialization:2.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.1'
    testImplementation "androidx.room:room-testing:$roomVersion"
    testImplementation 'org.json:json:20240303'

    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
