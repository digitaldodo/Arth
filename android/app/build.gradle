plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def gradleValue = { String name, String fallback = '' ->
    providers.gradleProperty(name).orElse(providers.environmentVariable(name)).getOrElse(fallback)
}
def javaString = { String value -> '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"' }

def keystoreFilePath = System.getenv("ANDROID_KEYSTORE_PATH") ?: System.getenv("KEYSTORE_FILE") ?: "release.keystore"
def keystorePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD") ?: System.getenv("KEYSTORE_PASSWORD")
def keyAlias = System.getenv("ANDROID_KEY_ALIAS") ?: System.getenv("KEY_ALIAS") ?: "arth"
def keyPassword = System.getenv("ANDROID_KEY_PASSWORD") ?: System.getenv("KEY_PASSWORD")
def certFingerprint = System.getenv("ANDROID_CERT_SHA256") ?: "CERT_FINGERPRINT_PLACEHOLDER"

android {
    namespace 'com.digitaldodo.arth'
    compileSdk 36

    defaultConfig {
        applicationId "com.digitaldodo.arth"
        minSdk 23
        targetSdk 36
        versionCode 2
        versionName "1.1.0"
        buildConfigField "String", "SUPABASE_URL", javaString(gradleValue('ARTH_SUPABASE_URL'))
        buildConfigField "String", "SUPABASE_ANON_KEY", javaString(gradleValue('ARTH_SUPABASE_ANON_KEY'))
        buildConfigField "String", "API_URL", javaString(gradleValue('ARTH_API_URL'))

        resValue "string", "appName", "Arth"
        resValue "string", "defaultUrl", "https://arth-9h3f.vercel.app/"
        resValue "string", "hostName", "arth-9h3f.vercel.app"
        resValue "string", "assetStatements", '[{"relation": ["delegate_permission/common.handle_all_urls"], "target": {"namespace": "android_app", "package_name": "com.digitaldodo.arth", "sha256_cert_fingerprints": ["' + certFingerprint + '"]}}]'
    }

    signingConfigs {
        release {
            if (keystorePassword && keyPassword && file(keystoreFilePath).exists()) {
                storeFile file(keystoreFilePath)
                storePassword keystorePassword
                keyAlias keyAlias
                keyPassword keyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePassword && keyPassword && file(keystoreFilePath).exists()) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures { buildConfig true }
}

dependencies {
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.browser:browser:1.8.0'
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    implementation 'androidx.work:work-runtime-ktx:2.9.1'
    testImplementation 'junit:junit:4.13.2'
}
